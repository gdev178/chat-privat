<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Live Chat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        navy: { 800: '#1e293b', 900: '#0f172a' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans">
    <header class="bg-navy-900 text-white p-4 flex justify-between items-center shadow-md">
        <h1 class="font-bold tracking-wide">CHAT DENGAN ADMIN</h1>
        <button onclick="logout()" class="text-xs bg-red-600/30 px-3 py-1 rounded hover:bg-red-600/50 transition">Logout</button>
    </header>

    <div id="messagesContainer" class="flex-1 overflow-y-auto p-4 space-y-4 bg-gray-50">
        <!-- Messages -->
        <div class="text-center text-gray-400 text-sm py-4">Memuat pesan...</div>
    </div>

    <div class="p-4 bg-white border-t border-gray-200 flex gap-2">
        <input type="text" id="messageInput" placeholder="Ketik pesan Anda..." class="flex-1 border border-gray-300 rounded-lg px-4 py-2 text-sm focus:outline-none focus:border-blue-500">
        <button onclick="sendMessage()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-medium transition">Kirim</button>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/supabase.js"></script>
    <script src="assets/js/chat.js"></script>
</body>
</html>
